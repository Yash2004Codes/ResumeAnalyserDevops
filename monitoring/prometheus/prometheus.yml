global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "fastapi_backend"
    metrics_path: "/metrics"
    scrape_interval: 15s
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: "resume-backend"
          env: "production"

  - job_name: "node_exporter"
    scrape_interval: 15s
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: "host-metrics"
