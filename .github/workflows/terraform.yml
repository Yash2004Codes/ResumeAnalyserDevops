name: Terraform

# Infrastructure as code through the pipeline:
#   PR     -> fmt, validate, plan (read-only role); plan posted as a PR comment
#   master -> plan, then apply in the `production` environment once a reviewer approves
on:
  pull_request:
    paths: ["terraform/aws/**", ".github/workflows/terraform.yml"]
  push:
    branches: [master]
    paths: ["terraform/aws/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:

permissions:
  contents: read

# PRs cancel superseded plans; master runs queue so applies never overlap
concurrency:
  group: terraform-${{ github.event_name == 'pull_request' && github.ref || 'master' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_VERSION: 1.16.5
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
  TF_VAR_github_repo_immutable_subject: ${{ vars.GH_OIDC_SUBJECT }}

jobs:
  plan:
    # Fork PRs get no OIDC token, so they cannot plan
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC
      contents: read
      pull-requests: write # plan comment
    defaults:
      run:
        working-directory: terraform/aws
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: fmt
        run: terraform fmt -check -recursive

      - name: init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=aws/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: validate
        run: terraform validate -no-color

      - name: plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -lock-timeout=5m -detailed-exitcode -out=tfplan
          code=$?
          set -e
          [ "$code" -eq 1 ] && exit 1
          echo "has_changes=$([ "$code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          terraform show -no-color tfplan > plan.txt
          {
            echo "### Terraform plan"
            echo '```'
            grep -E '^Plan:|^No changes' plan.txt || true
            echo '```'
            echo '<details><summary>Full plan</summary>'
            echo
            echo '```hcl'
            head -c 60000 plan.txt
            echo '```'
            echo '</details>'
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment plan on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan -->';
            const body = `${marker}\n${fs.readFileSync('terraform/aws/summary.md', 'utf8')}\n_Commit ${context.sha.slice(0, 7)}_`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  apply:
    needs: plan
    if: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && needs.plan.outputs.has_changes == 'true' }}
    runs-on: ubuntu-latest
    # Required reviewers on this environment pause the job until someone approves
    environment: production
    permissions:
      id-token: write # OIDC
      contents: read
    defaults:
      run:
        working-directory: terraform/aws
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=aws/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      # Re-plans instead of downloading the plan job's file: saved plans hold secret values in
      # plain text, and artifacts of a public repo can be downloaded by anyone
      - name: plan + apply
        run: |
          terraform plan -no-color -lock-timeout=5m -out=tfplan
          terraform apply -no-color -lock-timeout=5m tfplan
