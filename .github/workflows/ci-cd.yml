name: CI/CD

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      rollback_tag:
        description: "Redeploy an existing image tag (git SHA) instead of building"
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-tests:
    if: ${{ !inputs.rollback_tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Pytest
        working-directory: backend
        run: pytest -q

  frontend-lint:
    if: ${{ !inputs.rollback_tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  gitleaks:
    if: ${{ !inputs.rollback_tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sonarcloud:
    if: ${{ !inputs.rollback_tag }}
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform-validate:
    if: ${{ !inputs.rollback_tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: fmt + validate
        working-directory: terraform/aws
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

  build-and-deploy:
    # always() so a rollback (test jobs skipped) still deploys; failures still block
    if: ${{ always() && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    needs: [backend-tests, frontend-lint, gitleaks, sonarcloud, terraform-validate]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      IMAGE_TAG: ${{ inputs.rollback_tag || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, scan and push (skipped on rollback)
        if: ${{ !inputs.rollback_tag }}
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          build_push() {
            name=$1; shift
            if aws ecr describe-images --repository-name "$name" --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
              echo "$name:$IMAGE_TAG already in ECR, skipping"
              return
            fi
            docker build -t "$REGISTRY/$name:$IMAGE_TAG" "$@"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 \
              image --severity CRITICAL --ignore-unfixed --exit-code 1 "$REGISTRY/$name:$IMAGE_TAG"
            docker push "$REGISTRY/$name:$IMAGE_TAG"
          }
          build_push resume-backend ./backend
          build_push resume-frontend --build-arg NEXT_PUBLIC_BACKEND_URL=/api .

      - name: Deploy to EC2 through SSM
        run: |
          CMD="cd /opt/devops-resume-analyser && git fetch --depth 1 origin master && git reset --hard FETCH_HEAD && chmod +x scripts/deploy.sh && scripts/deploy.sh $IMAGE_TAG"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --parameters "commands=[\"$CMD\"]" \
            --timeout-seconds 900 \
            --query Command.CommandId --output text)
          if ! aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}"; then
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --query '[StandardOutputContent,StandardErrorContent]' --output text
            exit 1
          fi
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query StandardOutputContent --output text
